name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  repository-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/02-example/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: cd examples/02-example && npm ci
      - run: npm run validate
      - run: npm run schema:check
      - run: npm run skills:check
      - run: python scripts/validate/validate_skill_bundles.py skill-zips
      - run: python scripts/validate/validate_cli_discovery.py

  skill-bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm run package-skills

  cli-discovery:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run package-skills
      - run: python scripts/validate/validate_cli_discovery.py --online --skill-zips skill-zips

  reference-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/02-example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/02-example/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: python ../../scripts/evidence/generate_capability_receipt.py . --run-id ci
      - run: python ../../scripts/validate/validate_capability_receipt.py capability-receipt.json --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-evidence
          path: |
            examples/02-example/playwright-report
            examples/02-example/test-results

  performance-budget:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/02-example/package-lock.json
      - run: npm ci
        working-directory: examples/02-example
      - run: npm run build
        working-directory: examples/02-example
      - name: Serve app and run Lighthouse audit
        working-directory: examples/02-example
        env:
          CI: "true"
        run: |
          npx vite preview --port 4173 > preview.log 2>&1 &
          sleep 5
          npx --yes lighthouse http://localhost:4173/deckforge/ --chrome-flags="--headless --no-sandbox" --output=json --output-path=lhr.json --quiet
      - run: python scripts/validate/check_performance_budget.py --report examples/02-example/lhr.json

  export-goldens:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: examples/02-example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/02-example/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run goldens
      - run: python ../../scripts/validate/compare_export_goldens.py --export-dir test-results/goldens --golden-dir ../../tests/goldens

  capability-receipt:
    needs: [repository-static, skill-bundles, reference-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: playwright-evidence
          path: evidence
      - run: python scripts/validate/validate_capability_receipt.py examples/02-example/capability-receipt.json --strict

  skill-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest tests.trigger.test_trigger_routing
      - run: python scripts/evals/run_skill_eval.py --case-id editable-deck --condition current --workdir examples/02-example --toolchain npm

  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: cd examples/02-example && npm ci
      - run: python scripts/validate/check_release_gate.py --workdir examples/02-example
